[project]
name = "bot-detector"
version = "0.1.0"
description = "Определение ботов в диалогах: LightGBM на признаках из rubert-tiny2, сервис на FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.17.2",
    "pandas>=3.1.0",
    "prometheus-client>=0.26.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
# ноутбуки и подбор гиперпараметров — только для разработки, в Docker-образ не попадают
dev = [
    "notebook>=7.6.3",
    "optuna>=5.0.0",
]

# torch на Linux (Docker) — CPU-сборка: обычная тянет CUDA на несколько гигабайт, а GPU сервису не нужен
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
